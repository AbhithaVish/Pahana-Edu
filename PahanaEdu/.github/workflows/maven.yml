name: Java Maven CI

on:
  push:               # Run after every commit push
    branches:
      - main   # Change to "main" if you want main branch instead
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Step 3: Build with Maven (includes tests)
      - name: Build with Maven
        run: mvn -B clean verify

      # Optional: Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pahana-edu-war
          path: target/pahana-edu.war
